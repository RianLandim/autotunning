[project]
name = "autotunning"
version = "0.1.0"
description = "Autonomous fine-tuning research for task-specific models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitsandbytes>=0.45.0",
    "peft>=0.17.0",
    "torch==2.9.1",
    "transformers>=4.56.0",
]

[project.optional-dependencies]
sagemaker = [
    "boto3>=1.43.113",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
